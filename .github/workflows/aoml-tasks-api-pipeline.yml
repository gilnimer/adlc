# Production AOML pipeline using the Agent Tasks API (v2026-03-10).
#
# Unlike the issue-based pipeline (aoml-pipeline.yml) which requires
# multiple workflow runs and PR event triggers, this version runs the
# entire pipeline in a single job by polling the Tasks API directly.
#
# Flow:
#   For each step in PIPELINE:
#     1. task start  → POST /agents/repos/{owner}/{repo}/tasks
#     2. task wait   → poll until completed/failed
#     3. extract     → read PR result from artifacts
#     4. checkpoint  → save progress, advance to next step
#
# Requires: COPILOT_TOKEN secret (fine-grained PAT with "Agent tasks" permission)

name: AOML Pipeline (Tasks API)

on:
    workflow_dispatch:
        inputs:
            ticket:
                description: "Ticket / task description"
                required: true
                default: "Create a README.md for the project"
            model:
                description: "Model to use (leave empty for default)"
                required: false
                default: ""
            timeout:
                description: "Timeout per step in seconds"
                required: false
                default: "600"

permissions:
    contents: write
    pull-requests: write

env:
    PIPELINE: |
        [
          {
            "id": "develop",
            "agent": "developer",
            "prompt": "Implement the following task:\n\n$TICKET\n\nWrite clean, well-tested code. Create or modify files as needed."
          },
          {
            "id": "review",
            "agent": "developer",
            "prompt": "Review the code changes from the previous step. Check for:\n- Code quality and best practices\n- Missing error handling\n- Security issues\n\nFix any issues you find. Previous result:\n\n$PREV_RESULT"
          }
        ]

jobs:
    pipeline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install pnpm
              run: corepack enable && corepack prepare pnpm@latest --activate

            - name: Install & build
              run: pnpm install --frozen-lockfile && pnpm -r run build

            - name: Run pipeline
              env:
                  GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  PIPELINE='${{ env.PIPELINE }}'
                  TOTAL=$(echo "$PIPELINE" | jq 'length')
                  TICKET="${{ github.event.inputs.ticket }}"
                  MODEL="${{ github.event.inputs.model }}"
                  TIMEOUT="${{ github.event.inputs.timeout }}"
                  BASE_BRANCH="${{ github.ref_name }}"
                  PREV_RESULT=""

                  echo "## AOML Pipeline" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Ticket:** $TICKET" >> $GITHUB_STEP_SUMMARY
                  echo "**Steps:** $TOTAL" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  for IDX in $(seq 0 $((TOTAL - 1))); do
                    STEP=$(echo "$PIPELINE" | jq -r ".[$IDX]")
                    STEP_ID=$(echo "$STEP" | jq -r '.id')
                    AGENT=$(echo "$STEP" | jq -r '.agent')

                    # Substitute variables in prompt
                    PROMPT=$(echo "$STEP" | jq -r '.prompt')
                    PROMPT="${PROMPT//\$TICKET/$TICKET}"
                    if [ -n "$PREV_RESULT" ]; then
                      PROMPT="${PROMPT//\$PREV_RESULT/$PREV_RESULT}"
                    fi

                    echo "=================================================="
                    echo "Step $((IDX + 1))/$TOTAL: $STEP_ID (agent: $AGENT)"
                    echo "=================================================="

                    # Build model flag
                    MODEL_FLAG=""
                    if [ -n "$MODEL" ]; then
                      MODEL_FLAG="--model $MODEL"
                    fi

                    # 1. Start task
                    node packages/agent/dist/pipeline-cli.js task start \
                      --prompt "$PROMPT" \
                      --owner "${{ github.repository_owner }}" \
                      --repo "${{ github.event.repository.name }}" \
                      --base "$BASE_BRANCH" \
                      $MODEL_FLAG \
                      > /tmp/task-start-output.json
                    cat /tmp/task-start-output.json

                    TASK_ID=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/task-start-output.json','utf8')).id)")
                    echo "Task started: $TASK_ID"

                    # 2. Wait for completion
                    node packages/agent/dist/pipeline-cli.js task wait \
                      --task-id "$TASK_ID" \
                      --owner "${{ github.repository_owner }}" \
                      --repo "${{ github.event.repository.name }}" \
                      --timeout "$TIMEOUT" \
                      --interval 15 \
                      > /tmp/task-wait-output.json
                    cat /tmp/task-wait-output.json

                    TASK_STATE=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/task-wait-output.json','utf8')).state)")
                    PR_NUMBER=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/tmp/task-wait-output.json','utf8')).prNumber))")

                    echo "Task state: $TASK_STATE, PR: $PR_NUMBER"

                    if [ "$TASK_STATE" != "completed" ]; then
                      echo "### Step $STEP_ID: FAILED ($TASK_STATE)" >> $GITHUB_STEP_SUMMARY
                      echo "Task $TASK_ID ended with state: $TASK_STATE"
                      exit 1
                    fi

                    # 3. Extract PR result
                    if [ "$PR_NUMBER" != "null" ]; then
                      node packages/agent/dist/pipeline-cli.js extract \
                        --pr "$PR_NUMBER" \
                        --owner "${{ github.repository_owner }}" \
                        --repo "${{ github.event.repository.name }}" \
                        > /tmp/extract-output.json
                      cat /tmp/extract-output.json

                      PREV_RESULT=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/extract-output.json','utf8')).extractedData.slice(0,2000))")

                      # Use PR branch as base for next step
                      SESSIONS=$(node -e "
                        const t = JSON.parse(require('fs').readFileSync('/tmp/task-wait-output.json','utf8'));
                        const s = t.sessions && t.sessions[0];
                        process.stdout.write(s ? s.headRef : '');
                      ")
                      if [ -n "$SESSIONS" ]; then
                        BASE_BRANCH="$SESSIONS"
                      fi
                    else
                      PREV_RESULT="Step $STEP_ID completed (no PR)"
                    fi

                    # 4. Save checkpoint
                    node packages/agent/dist/pipeline-cli.js checkpoint save \
                      --step "$STEP_ID" \
                      --issue "0" \
                      --base "$BASE_BRANCH" \
                      --variables "{\"ticket\": \"$TICKET\", \"taskId\": \"$TASK_ID\"}"

                    echo "### Step $STEP_ID: completed (PR #$PR_NUMBER)" >> $GITHUB_STEP_SUMMARY
                    echo ""
                  done

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Pipeline complete — all $TOTAL steps finished.**" >> $GITHUB_STEP_SUMMARY
                  echo ""
                  echo "Pipeline complete!"
