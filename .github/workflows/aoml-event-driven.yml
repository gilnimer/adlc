# Event-driven AOML workflow — one step per run, no polling.
#
# Flow:
#   1. `workflow_dispatch` → startStep: parse AOML, trigger first cloud agent step, save state
#   2. `pull_request.review_requested` → continueStep: read PR result, advance engine,
#      trigger next step (if any), save state
#   3. Repeats until all steps are done
#
# State is persisted in `.aoml-state/checkpoint.json` and committed between runs.
# This avoids polling entirely — GitHub's event system drives the workflow.

name: AOML Event-Driven

on:
    workflow_dispatch:
        inputs:
            workflow-file:
                description: "Path to the AOML workflow XML file"
                required: true
                default: ".github/workflows/feature-dev.xml"

    pull_request:
        types: [ review_requested ]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    aoml-start:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci || true

            - name: Start AOML workflow
              id: start
              uses: ./packages/action
              env:
                  GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
              with:
                  workflow-file: ${{ github.event.inputs.workflow-file }}
                  execution-mode: event-driven

            - name: Commit checkpoint
              if: steps.start.outputs.done != 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .aoml-state/
                  git commit -m "[aoml] checkpoint: step ${{ steps.start.outputs.step-id }}" || true
                  git push

    aoml-continue:
        if: >-
            github.event_name == 'pull_request' && github.event.action ==
            'review_requested' && contains(github.event.pull_request.title,
            '[AOML]')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci || true

            - name: Continue AOML workflow
              id: continue
              uses: ./packages/action
              env:
                  GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || secrets.GITHUB_TOKEN }}
              with:
                  execution-mode: event-driven-continue
                  pr-number: ${{ github.event.pull_request.number }}

            - name: Commit checkpoint
              if: steps.continue.outputs.done != 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add .aoml-state/
                  git commit -m "[aoml] checkpoint: step ${{ steps.continue.outputs.step-id }}" || true
                  git push

            - name: Post summary
              if: steps.continue.outputs.done == 'true'
              run: echo "${{ steps.continue.outputs.summary }}"
